name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 v2.0.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: v2-fluent
            artifact: MDPad-v2-win64.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ${{ matrix.app }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r ${{ matrix.app }}/requirements.txt

      - name: Build with PyInstaller
        run: |
          cd ${{ matrix.app }}/pack
          pyinstaller MDPad.spec

      # onedir 产物是 dist/MDPad/ 整个文件夹（MDPad.exe + _internal/），
      # 打成一个 zip 发布；解压后双击里面的 MDPad.exe 即可（别把 exe 单独挪出来）
      - name: Package folder
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.app }}/pack/dist/MDPad/*" `
                           -DestinationPath "${{ matrix.app }}/pack/dist/${{ matrix.artifact }}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.app }}
          path: ${{ matrix.app }}/pack/dist/${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: exes
          merge-multiple: true

      - name: Create/Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          files: exes/*.zip
          generate_release_notes: true
